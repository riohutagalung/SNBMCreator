name: SNBM Creator CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test Hostinger startup and public routes
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3000 node -e "require('./server.js')" > /tmp/snbm-serve.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/health.json 2>/dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/snbm-serve.log; exit 1; fi
            sleep 0.2
          done
          grep -q '"ok":true' /tmp/health.json
          for route in / /tentang /layanan /kontak /gabung-host /blog /privasi /syarat /llms.txt /sitemap.xml; do
            echo "Checking $route"
            curl -fsS --max-time 15 -o /dev/null "http://127.0.0.1:3000$route"
          done
          curl -fsS -H 'Accept: text/markdown' http://127.0.0.1:3000/ | grep -q 'SNBM Creator'
          curl -fsS http://127.0.0.1:3000/.well-known/mcp/server-card.json | grep -q 'serverInfo'
          curl -fsS -H 'Content-Type: application/json' -X POST -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:3000/mcp | grep -q 'get_snbm_business_info'
          CSS=$(find dist/apps/web/client/assets -name 'index-*.css' -print -quit)
          curl -fsS -o /dev/null "http://127.0.0.1:3000/assets/$(basename "$CSS")"
          for asset in logo.png favicon.png regular-hijab.webp regular-nonhijab.webp big-hijab.webp big-nonhijab.webp hero-still.webp hero-fashion.webm; do
            curl -fsS -o /dev/null "http://127.0.0.1:3000/assets/snbm/$asset"
          done
      - name: Check PocketBase migration syntax
        run: |
          for script in apps/pocketbase/pb_migrations/*.js; do node --check "$script"; done